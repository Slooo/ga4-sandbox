<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet"></head><body>
<div class="container mt-4"><h1>Категория</h1><div class="row" id="products"></div></div>
<script src="js/analytics.js"></script><script src="js/data.js"></script><script src="js/cart.js"></script><script src="js/favorites.js"></script>
<script>
const cat=new URLSearchParams(location.search).get('category');
track('view_category',{category:cat});
PRODUCTS.filter(p=>p.category===cat).forEach(p=>products.innerHTML+=`
<div class="col-md-4"><div class="card p-3 mb-3">
<h5>${p.name}</h5><p>$${p.price}</p>
<a class="btn btn-sm btn-outline-primary" href="product.html?id=${p.id}">Открыть</a>
<button class="btn btn-sm btn-primary" onclick="addToCart(${p.id})">В корзину</button>
</div></div>`)
</script></body></html>
