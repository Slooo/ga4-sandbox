<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet"></head><body>
<div id="header"></div>
<div class="container-fluid"><div class="row">
<div id="sidebar" class="col-md-3"></div>
<main class="col-md-9 p-4"><h1>Категория</h1><div id='list' class='row'></div></main>
</div></div>
<div id="footer"></div>
<script src="js/analytics.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/layout.js"></script>
<script>
const cat=new URLSearchParams(location.search).get('category');
list.innerHTML=PRODUCTS.filter(p=>p.category===cat).map(p=>`<div class='col-md-4'><div class='card p-3'><h5>${p.name}</h5><button onclick='addToCart(${p.id})'>🛒</button><button onclick='addToFavorites(${p.id})'>❤️</button><a href='product.html?id=${p.id}'>Открыть</a></div></div>`).join('');
track('view_category',{category:cat});
</script>
</body></html>
