<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div class="container mt-4"><h1>Корзина</h1><div id="items"></div>
<hr><input class="form-control mb-2" placeholder="Имя">
<input class="form-control mb-2" placeholder="Телефон">
<input class="form-control mb-2" placeholder="Адрес">
<button class="btn btn-success" onclick="checkout()">Оформить заказ</button>
</div>
<script src="js/analytics.js"></script><script src="js/data.js"></script><script src="js/cart.js"></script>
<script>
track('view_cart');
renderCart('items');
function checkout(){
track('begin_checkout');
if(confirm('Вы уверены?')){
track('purchase',{order_id:Date.now()});
location='success.html';
}}
</script></body></html>
