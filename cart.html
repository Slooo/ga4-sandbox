<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet"></head><body>
<div id="header"></div>
<div class="container-fluid"><div class="row">
<div id="sidebar" class="col-md-3"></div>
<main class="col-md-9 p-4"><h1>Корзина</h1><div id='cart'></div><hr><input class='form-control mb-2' placeholder='Имя'><input class='form-control mb-2' placeholder='Телефон'><input class='form-control mb-2' placeholder='Адрес'><button onclick='buy()' class='btn btn-pink'>Оформить</button></main>
</div></div>
<div id="footer"></div>
<script src="js/analytics.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/layout.js"></script>
<script>
function render(){cart.innerHTML=getCart().map(i=>`<div>${PRODUCTS.find(p=>p.id===i)?.name}</div>`).join('')}
render(); track('view_cart');
function buy(){track('begin_checkout'); if(confirm('Подтвердить заказ?')){track('purchase',{order_id:Date.now()}); location='success.html';}}
</script>
</body></html>
