<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet"></head><body>
<div id="header"></div>
<div class="container-fluid"><div class="row">
<div id="sidebar" class="col-md-3"></div>
<main class="col-md-9 p-4"><div id='product'></div></main>
</div></div>
<div id="footer"></div>
<script src="js/analytics.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/layout.js"></script>
<script>
const id=+new URLSearchParams(location.search).get('id');
const p=PRODUCTS.find(x=>x.id===id);
product.innerHTML=`<h1>${p.name}</h1><p>$${p.price}</p><button onclick='addToCart(${p.id})'>В корзину</button><button onclick='addToFavorites(${p.id})'>❤️</button>`;
track('view_item',{item_id:id});
</script>
</body></html>
