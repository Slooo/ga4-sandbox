<!doctype html><html><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<div class="container mt-4" id="app"></div>
<script src="js/analytics.js"></script><script src="js/data.js"></script><script src="js/cart.js"></script><script src="js/favorites.js"></script>
<script>
const id=+new URLSearchParams(location.search).get('id');
const p=PRODUCTS.find(x=>x.id===id);
track('view_item',{item_id:id,item_name:p.name});
app.innerHTML=`<h1>${p.name}</h1><p>$${p.price}</p>
<button class="btn btn-primary" onclick="addToCart(${p.id})">В корзину</button>
<button class="btn btn-outline-danger" onclick="addToFavorites(${p.id})">❤️</button>`;
</script></body></html>
